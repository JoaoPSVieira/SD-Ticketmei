# Pipeline de integração contínua (RNF4, fases 1 e 2):
#   1. testes automáticos de cada serviço (com um RabbitMQ verdadeiro para os testes de integração)
#   2. compilação das imagens Docker e arranque do ambiente Docker Compose
#   3. smoke test do sistema completo e testes de carga k6 (com carga reduzida)
#
# Corre em cada push para o main, em cada Pull Request e à mão (separador Actions -> CI -> Run workflow).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    name: Testes (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [catalog, api-gateway, order, notification]

    # RabbitMQ para os testes de integração do Order e do Notification (os outros não o usam)
    services:
      rabbitmq:
        image: rabbitmq:3.13-management
        env:
          RABBITMQ_DEFAULT_USER: ticketmei
          RABBITMQ_DEFAULT_PASS: ticketmei
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
      
      # Redis para os testes do rate limiter do Gateway (fase 3)
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    # 127.0.0.1 explícito: nas máquinas do GitHub "localhost" resolve primeiro para IPv6 (::1)
    env:
      RABBITMQ_TEST_URL: amqp://ticketmei:ticketmei@127.0.0.1:5672/
      REDIS_TEST_URL: redis://127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements*.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Correr os testes
        run: python -m pytest -rs

  compose:
    name: Docker Compose e k6
    runs-on: ubuntu-latest
    needs: testes

    steps:
      - uses: actions/checkout@v5

      - name: Validar o docker-compose.yml
        run: docker compose config --quiet

      - name: Construir as imagens
        run: docker compose build

      # O cAdvisor e o Grafana não são precisos para os testes; os restantes arrancam pela ordem dos
      # healthchecks (depends_on) e o --wait espera até estarem todos healthy
      - name: Arrancar os serviços
        run: docker compose up -d --wait --wait-timeout 240 catalog api-gateway order notification rabbitmq prometheus

      - name: Smoke test
        run: bash ci/smoke-test.sh

      # Carga reduzida: as máquinas do GitHub Actions são pequenas e partilhadas, e o objetivo aqui
      # é confirmar que tudo funciona sob carga (os thresholds dos scripts continuam a aplicar-se)
      - name: k6 - eventos (GET /events)
        run: docker compose run --rm k6 run --stage 20s:50,40s:50,10s:0 load-test.js

      - name: k6 - compras (POST /orders e GET /orders/{id})
        run: docker compose run --rm k6 run --stage 20s:20,40s:20,10s:0 orders-test.js

      - name: Logs dos serviços (só se algum passo falhar)
        if: failure()
        run: docker compose logs --no-color

      - name: Parar e limpar
        if: always()
        run: docker compose down -v

  # Fase 3: valida os manifestos Kubernetes contra os esquemas oficiais (incluindo a Application do
  # Argo CD). Um erro num YAML é apanhado no Pull Request, antes de chegar ao main e ao Argo CD.
  k8s:
    name: Manifestos Kubernetes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Instalar o kubeconform
        run: curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform

      - name: Validar os manifestos
        run: >-
          ./kubeconform -strict -summary -kubernetes-version 1.33.0
          -schema-location default
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          k8s/ k8s-tools/ argocd/

      - name: ConfigMaps da monitorização em dia
        run: python3 k8s-tools/gerar-configmaps.py --check