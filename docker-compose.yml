networks:
  ticketmei-net:
    driver: bridge

services:
  catalog:
    build: ./catalog
    container_name: catalog
    ports:
      - "8001:8001"
    networks:
      - ticketmei-net

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    environment:
      - CATALOG_URL=http://catalog:8001
      - CATALOG_TIMEOUT_SECONDS=2
    ports:
      - "8000:8000"
    depends_on:
      catalog:
        condition: service_healthy
    networks:
      - ticketmei-net

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - ticketmei-net

  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - ticketmei-net

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - ticketmei-net

  k6:
    image: grafana/k6:0.49.0
    container_name: k6
    user: root
    working_dir: /ci-scripts
    volumes:
      - ./k6:/ci-scripts
    command: run load-test.js
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - ticketmei-net
    profiles:
      - testing

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    environment:
      # Utilizador usado pelo Order e pelo Notification
      - RABBITMQ_DEFAULT_USER=ticketmei
      - RABBITMQ_DEFAULT_PASS=ticketmei
    ports:
      - "5672:5672"     # Onde os serviços publicam e consomem mensagens
      - "15672:15672"   # Interface web de gestão
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - ticketmei-net

  order:
    build: ./order
    container_name: order
    environment:
      - CATALOG_URL=http://catalog:8001
      - RABBITMQ_URL=amqp://ticketmei:ticketmei@rabbitmq:5672/
    ports:
      - "8002:8002"
    volumes:
      - order-data:/app/data
    depends_on:
      catalog:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ticketmei-net

volumes:
  order-data: