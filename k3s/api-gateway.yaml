# API Gateway: a única porta de entrada dos clientes. Encaminha /events para o Catalog e
# /orders para o Order. Na fase 3 aplica também o rate limiter (com o Redis).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: grupo08
  labels:
    app: api-gateway
spec:
  replicas: 1
  # Recreate: a quota do grupo08 (CPU, PVCs) não deixa existir o pod antigo e o novo ao mesmo tempo
  # (com RollingUpdate o pod novo ficava preso em "exceeded quota" e a atualização nunca terminava).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      enableServiceLinks: false
      # Pod Security "restricted" (cluster global): sem root e sem privilégios
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          # A pipeline de CD (.github/workflows/cd.yml)
          image: ghcr.io/joaopsvieira/ticketmei-api-gateway:ae6f7181159d74f6b7399210997c25a5a110dfcb
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # Os outros serviços são encontrados pelo nome do Service (DNS do Kubernetes)
            - name: CATALOG_URL
              value: http://catalog:8001
            - name: CATALOG_TIMEOUT_SECONDS
              value: "2"
            - name: ORDER_URL
              value: http://order:8002
            # 10 s: o Order agora espera pelo pagamento (com retries)
            - name: ORDER_TIMEOUT_SECONDS
              value: "10"
            # Rate limiter do POST /orders: baldes no Redis, 5 compras/s por cliente (IP), rajadas até 5
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: RATE_LIMIT_PER_SECOND
              value: "5"
            - name: RATE_LIMIT_BURST
              value: "5"
            - name: WEB_CONCURRENCY
              value: "4"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          # Antes de o contentor parar (rolling update, reinício), espera 5 s com o serviço ainda a
          # responder: dá tempo ao Kubernetes de deixar de enviar pedidos novos para este pod, e assim
          # nenhum pedido é perdido durante a troca
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
# ClusterIP no cluster global (não há LoadBalancer para o nosso namespace): o endereço dentro do
# cluster é http://api-gateway:8000. Para acesso de fora, ver a dúvida do Ingress à docente.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: grupo08
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http