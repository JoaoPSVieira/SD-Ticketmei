# Catalog: lista de eventos (GET /events e GET /events/{id}). Sem estado: os eventos vêm do
# ficheiro data/events.json que está dentro da imagem.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: grupo08
  labels:
    app: catalog
spec:
  replicas: 1
  # Recreate: a quota do grupo08 (CPU, PVCs) não deixa existir o pod antigo e o novo ao mesmo tempo
  # (com RollingUpdate o pod novo ficava preso em "exceeded quota" e a atualização nunca terminava).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      enableServiceLinks: false
      # Pod Security "restricted" (cluster global): sem root e sem privilégios
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: catalog
          # A pipeline de CD (.github/workflows/cd.yml)
          image: ghcr.io/joaopsvieira/ticketmei-catalog:1df2fe33c0c1c08d45e8abe1fb87ef669e077cb0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: WEB_CONCURRENCY
              value: "2"
          ports:
            - name: http
              containerPort: 8001
          # Pronto: só recebe pedidos depois de o /health responder
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # Vivo: se o /health deixar de responder durante ~50 s, o Kubernetes reinicia o contentor
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          # Antes de o contentor parar (rolling update, reinício), espera 5 s com o serviço ainda a
          # responder: dá tempo ao Kubernetes de deixar de enviar pedidos novos para este pod, e assim
          # nenhum pedido é perdido durante a troca
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
---
# Nome "catalog" no DNS do cluster (http://catalog:8001). Só é acessível dentro do cluster:
# os clientes passam sempre pelo API Gateway.
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: grupo08
  labels:
    app: catalog
spec:
  selector:
    app: catalog
  ports:
    - name: http
      port: 8001
      targetPort: http