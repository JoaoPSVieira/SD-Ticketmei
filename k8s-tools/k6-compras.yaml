# Teste de carga k6 da fase 2 (POST /orders e GET /orders/{id}, 50 utilizadores virtuais), a
# correr dentro do cluster. Corre-se à mão com:   .\k8s-tools\k6.ps1 compras
# (fica fora da pasta k8s/ pelo mesmo motivo do k6-eventos.yaml)

apiVersion: batch/v1
kind: Job
metadata:
  name: k6-compras
  namespace: ticketmei
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.49.0
          args: ["run", "/scripts/orders-test.js"]
          env:
            - name: BASE_URL
              value: http://api-gateway:8000
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: k6-scripts
