# FICHEIRO GERADO por k8s-tools/gerar-configmaps.py: não editar à mão.
# Para mudar a configuração, altera os ficheiros originais (prometheus/prometheus.yml,
# grafana/provisioning/ e grafana/dashboards/) e volta a correr o script.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ticketmei
data:
  prometheus.yml: |-
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: 'api-gateway'
        static_configs:
          - targets: ['api-gateway:8000']

      - job_name: 'catalog'
        static_configs:
          - targets: ['catalog:8001']

      - job_name: 'cadvisor'
        static_configs:
          - targets: ['cadvisor:8080']
        metric_relabel_configs:
          - source_labels: [container_label_io_kubernetes_pod_namespace, container_label_io_kubernetes_container_name]
            regex: 'ticketmei;(.+)'
            target_label: name
          
      - job_name: 'order'
        static_configs:
          - targets: ['order:8002']

      - job_name: 'notification'
        static_configs:
          - targets: ['notification:8003']

      - job_name: 'rabbitmq'
        static_configs:
          - targets: ['rabbitmq:15692']

      - job_name: 'rabbitmq-queues'
        metrics_path: /metrics/detailed
        params:
          family: ['queue_coarse_metrics']
        static_configs:
          - targets: ['rabbitmq:15692']
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: ticketmei
data:
  prometheus.yml: |-
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        # Tem de ser igual ao uid usado em grafana/dashboards/dashboard1.json
        uid: a72340b1-d871-4028-bbf1-1795e3553e62
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  namespace: ticketmei
data:
  dashboards.yml: |-
    apiVersion: 1

    providers:
      - name: ticketmei
        folder: TicketMEI
        type: file
        disableDeletion: false
        allowUiUpdates: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
